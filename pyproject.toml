[project]
name = "industrial-safety"
version = "1.0.0"
description = "Industrial AI safety compliance platform"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.10,<5",
    "PyYAML>=6,<7",
    "ultralytics==8.4.172",
    "onnxruntime==1.30.0",
    "openvino==2026.4.1",
    "fastapi>=0.142,<1",
    "uvicorn>=0.54,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
